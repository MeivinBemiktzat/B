name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create local tool manifest
        run: dotnet new tool-manifest --force

      - name: Install MonoGame Content Builder tool (local)
        run: dotnet tool install dotnet-mgcb --version 3.8.1.303

      - name: Restore dependencies
        run: dotnet restore EscapeSpaceStation.csproj

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish portable Windows build
        run: >
          dotnet publish EscapeSpaceStation.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish_output

      - name: Package portable folder as app.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "publish_output/*" -DestinationPath "app.zip" -Force

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "build-$(Get-Date -Format yyyyMMdd-HHmmss)-$($env:GITHUB_SHA.Substring(0,7))"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release with app.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Escape Space Station - ${{ steps.tag.outputs.tag }}"
          files: app.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
